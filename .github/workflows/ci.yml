name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    # Same image and user as docker-compose.yml. The integration tests create their own
    # throwaway database (f1_test_<random>) on this server and apply db/init/*.sql to it.
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_USER: f1
          POSTGRES_PASSWORD: f1_local_dev
          POSTGRES_DB: f1_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U f1 -d f1_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Read by f1_ingest.config.Settings; the host is localhost because the job runs on the runner.
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: f1
      POSTGRES_PASSWORD: f1_local_dev
      POSTGRES_DB: f1_db

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ingestion/pyproject.toml

      - name: Install the package with ruff and pytest
        run: pip install -e "./ingestion[dev]"

      - name: Lint
        run: ruff check ingestion

      - name: Check formatting
        run: ruff format --check ingestion

      - name: Offline tests
        run: pytest ingestion

      # A skipped integration test means the database was not reachable and nothing was tested,
      # so the step fails if the report lists any skip.
      - name: Integration tests (PostgreSQL)
        run: |
          pytest ingestion -m integration -rs | tee integration.log
          if grep -q SKIPPED integration.log; then
            echo "integration tests were skipped" >&2
            exit 1
          fi