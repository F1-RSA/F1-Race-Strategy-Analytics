[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-ingest"
version = "0.1.0"
description = "Ingestion clients for the F1 Race Strategy Analytics pipeline"
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.1",
    # The binary wheel bundles libpq, so the slim image needs no system packages.
    "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.setuptools]
packages = ["f1_ingest", "f1_ingest.sinks"]

[tool.setuptools.package-data]
# The transformation SQL is read at runtime, so it has to be in the installed package.
f1_ingest = ["sql/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets `pytest ingestion` import f1_ingest even without the editable install.
pythonpath = ["."]
markers = [
    "integration: needs the compose Postgres (docker compose up -d db); skipped if unreachable",
]
# Plain `pytest ingestion` stays offline; `pytest ingestion -m integration` runs the database tests.
addopts = '-m "not integration"'
